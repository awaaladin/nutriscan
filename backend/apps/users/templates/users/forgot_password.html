<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password | NutriScan</title>
<style>
  body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7fa;color:#0b192c}
  main{max-width:420px;margin:0 auto;padding:32px 16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px}
  label{display:block;margin:14px 0 4px;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#0b192c;color:#fff;font-size:16px}
  .ok{color:#166534}
</style>
</head>
<body>
<main>
  <h1>NutriScan</h1>
  <div class="card">
  {% if sent %}
    <p class="ok">If that email has a NutriScan account, we just sent a link to choose a new password. It can take a minute, and it may land in spam.</p>
  {% else %}
    <p>Enter the email you signed up with and we will send you a link.</p>
    <form method="post">
      {% csrf_token %}
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Send reset link</button>
    </form>
  {% endif %}
  </div>
</main>
</body>
</html>
