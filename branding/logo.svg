<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NutriScan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145233"/>
      <stop offset="1" stop-color="#0A2E1E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBC45A"/>
      <stop offset="1" stop-color="#D9A93A"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="26" y="26" width="460" height="460" rx="112" fill="url(#bg)" stroke="url(#gold)" stroke-width="24"/>
  <!-- scan brackets -->
  <g fill="none" stroke="#E6BB4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 196V160Q118 126 152 126H192"/>
    <path d="M320 126H360Q394 126 394 160V196"/>
    <path d="M118 316V352Q118 386 152 386H192"/>
  </g>
  <!-- QR finder squares -->
  <g fill="none" stroke="#F6F6EF" stroke-width="19" stroke-linejoin="round">
    <rect x="152" y="160" width="76" height="76" rx="5"/>
    <rect x="152" y="272" width="76" height="76" rx="5"/>
  </g>
  <!-- QR dots -->
  <g fill="#F6F6EF">
    <rect x="262" y="160" width="30" height="30"/>
    <rect x="322" y="152" width="34" height="34"/>
    <rect x="296" y="206" width="30" height="30"/>
    <rect x="336" y="238" width="38" height="20"/>
    <rect x="262" y="262" width="24" height="24"/>
  </g>
  <!-- leaves -->
  <path d="M262 378C252 342 276 320 314 316C322 346 306 378 262 378Z" fill="#7DBA3E"/>
  <path d="M318 410C316 350 360 304 436 292C436 360 396 410 318 410Z" fill="url(#gold)"/>
  <path d="M330 398C352 350 384 322 420 304" fill="none" stroke="#B8872A" stroke-width="7" stroke-linecap="round"/>
</svg>
